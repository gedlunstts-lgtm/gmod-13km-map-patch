name: build patcher

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: vet
        working-directory: patcher
        run: go vet ./...

      - name: build
        working-directory: patcher
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../gmod483k.exe .
          sha256sum ../gmod483k.exe | tee ../gmod483k.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: gmod483k
          path: |
            gmod483k.exe
            gmod483k.exe.sha256

      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gmod483k.exe
            gmod483k.exe.sha256
